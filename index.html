<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIBECAR — Авто из США с выгодой до 40%</title>
  <meta name="description" content="VIBECAR подбирает авто из США с выгодой до 40%. Пройдите опросник за 30 секунд." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --card-hover: #1c1c1c;
      --border: #2a2a2a;
      --text: #fafafa;
      --muted: #a3a3a3;
      --gold: #eab308;
      --gold-hover: #facc15;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .hero-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      pointer-events: none;
    }
    /* light scrim only at top + bottom for text legibility (subtle, not blurry) */
    .hero-fade {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 22%),
        linear-gradient(to top, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 30%);
    }
    .hero-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      flex: 1;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem;
    }
    .brand { display: flex; align-items: center; gap: 0.5rem; }
    .brand img { height: 32px; width: auto; }
    .brand span { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 999px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; transition: background 0.18s ease, transform 0.12s ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn svg { width: 20px; height: 20px; }

    .hero-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 0 1.25rem; gap: 1.5rem;
    }
    .hero-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800; line-height: 1.08; letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      max-width: 16ch;
    }
    .hero-sub {
      font-size: clamp(0.95rem, 2.5vw, 1.125rem);
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      max-width: 32ch;
    }
    .btn-cta {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--gold); color: #0a0a0a;
      font-weight: 600; font-size: 1rem;
      padding: 0.875rem 2rem; border-radius: 999px; border: none;
      cursor: pointer; text-decoration: none;
      transition: background 0.18s ease, transform 0.12s ease;
      box-shadow: 0 4px 20px rgba(234,179,8,0.25);
    }
    .btn-cta:hover { background: var(--gold-hover); }
    .btn-cta:active { transform: scale(0.98); }

    /* ===== QUIZ ===== */
    .quiz-section {
      padding: 4rem 1.25rem 3rem;
      max-width: 480px; margin: 0 auto; width: 100%;
    }
    .quiz-head { text-align: center; margin-bottom: 2rem; }
    .quiz-head h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .quiz-head p { color: var(--muted); font-size: 0.9rem; }

    .progress {
      height: 4px; background: var(--border); border-radius: 999px;
      overflow: hidden; margin-bottom: 2rem;
    }
    .progress-fill {
      height: 100%; background: var(--gold); border-radius: 999px;
      transition: width 0.3s ease;
    }

    .step-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; text-align: center; }
    .options {
      display: grid; gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .options.cols-2 { grid-template-columns: 1fr 1fr; }
    .options.cols-3 { grid-template-columns: repeat(3, 1fr); }

    .opt {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      padding: 1.25rem 0.5rem;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); cursor: pointer; text-align: center;
      transition: border-color 0.15s ease, background 0.15s ease;
      user-select: none;
    }
    .opt:hover { background: var(--card-hover); }
    .opt.selected { border-color: var(--gold); background: rgba(234,179,8,0.08); }
    .opt svg { width: 36px; height: 36px; stroke: var(--text); fill: none; stroke-width: 1.8; }
    .opt.selected svg { stroke: var(--gold); }
    .opt .lbl { font-size: 0.85rem; font-weight: 500; }

    .quiz-nav { display: flex; gap: 0.75rem; }
    .btn-ghost {
      flex: 0 0 auto;
      background: transparent; color: var(--text); font-weight: 500;
      padding: 0.875rem 1.5rem; border-radius: 999px;
      border: 1px solid var(--border); cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .btn-ghost:hover { border-color: #3a3a3a; }
    .btn-primary {
      flex: 1;
      background: var(--gold); color: #0a0a0a; font-weight: 600;
      padding: 0.875rem 1.5rem; border-radius: 999px; border: none;
      cursor: pointer; transition: background 0.15s ease, opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background: var(--gold-hover); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .field {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.875rem 1rem;
      color: var(--text); font-size: 1rem; font-family: inherit;
      transition: border-color 0.15s ease;
    }
    .field:focus { outline: none; border-color: var(--gold); }
    .field::placeholder { color: #6b7280; }
    .field.valid { border-color: #22c55e; }
    .field.invalid { border-color: #ef4444; }
    .field-label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
    .field-wrap { margin-bottom: 1.25rem; }
    .hint { font-size: 0.8rem; margin-top: 0.4rem; }
    .hint.ok { color: #22c55e; }
    .hint.err { color: #ef4444; }

    .success {
      text-align: center; padding: 2rem 0;
    }
    .success .badge {
      width: 56px; height: 56px; margin: 0 auto 1rem;
      border-radius: 999px; background: rgba(234,179,8,0.12);
      display: flex; align-items: center; justify-content: center;
    }
    .success .badge svg { width: 28px; height: 28px; stroke: var(--gold); fill: none; stroke-width: 2.5; }
    .success h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
    .success p { color: var(--muted); font-size: 0.9rem; }

    /* ===== FOOTER ===== */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 1.25rem; text-align: center;
    }
    .socials { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1.25rem; }
    .socials .icon-btn { background: transparent; border-color: var(--border); color: var(--muted); }
    .socials .icon-btn:hover { color: var(--text); border-color: #3a3a3a; }
    footer .email { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
    footer .email:hover { color: var(--text); }
    footer .copy { color: #6b7280; font-size: 0.8rem; margin-top: 1rem; }

    @media (max-width: 480px) {
      .options.cols-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .progress-fill { transition: none; }
    }
  </style>
</head>
<body>

  <script>
    // ===== ICONS =====
    const ICONS = {
      sedan: '<svg viewBox="0 0 48 48"><path d="M6 30h36M10 30l3-9h22l3 9M9 30v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4M31 30v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4"/><path d="M13 21l4-6h14l4 6"/></svg>',
      hatchback: '<svg viewBox="0 0 48 48"><path d="M6 31h36M10 31l2-8h24l2 8M9 31v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4M31 31v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4"/><path d="M12 23l3-6h18l3 6"/></svg>',
      wagon: '<svg viewBox="0 0 48 48"><path d="M5 30h38M9 30l2-8h26l2 8M8 30v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4M32 30v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4"/><path d="M11 22l3-6h22v6"/></svg>',
      crossover: '<svg viewBox="0 0 48 48"><path d="M6 28h36M10 28l2-7h24l2 7M9 28v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5M31 28v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5"/><path d="M13 21l3-5h16l3 5"/><path d="M16 33h2M30 33h2"/></svg>',
      minivan: '<svg viewBox="0 0 48 48"><path d="M6 29h36v3a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-3M9 29l2-9h26l2 9M8 34v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2M32 34v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2"/><path d="M13 20h22"/></svg>',
      suv: '<svg viewBox="0 0 48 48"><path d="M5 27h38M9 27l2-8h26l2 8M8 27v6a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-6M32 27v6a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-6"/><path d="M12 19l3-4h18l3 4"/><path d="M15 33h3M30 33h3"/></svg>',
      gasoline: '<svg viewBox="0 0 48 48"><path d="M14 6h14l8 8v28a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M14 18h20M12 24h4v8H12z"/><path d="M28 14h6"/></svg>',
      diesel: '<svg viewBox="0 0 48 48"><path d="M12 8h16l8 8v24a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z"/><path d="M28 8v8h8M12 22h24M16 30h6M16 36h10"/></svg>',
      hybrid: '<svg viewBox="0 0 48 48"><path d="M26 6L12 26h12l-2 16 16-22H24l2-14z"/></svg>',
      electric: '<svg viewBox="0 0 48 48"><path d="M24 6L12 26h11l-3 16 16-24H24l3-12z"/><circle cx="24" cy="24" r="20"/></svg>',
      plugin: '<svg viewBox="0 0 48 48"><path d="M14 6h12l8 8v28a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M26 6v8h8M14 22h20M18 30l4 6M30 30l4 6"/></svg>',
      polish: '<svg viewBox="0 0 48 48"><path d="M24 8l4 10h-8l4-10zM10 30h28l-3 8H13l-3-8zM16 30l2-6h12l2 6"/></svg>',
      clean: '<svg viewBox="0 0 48 48"><path d="M12 14h24M14 14v22a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V14M20 14V10h8v4M18 26h12M18 32h12"/></svg>',
      service: '<svg viewBox="0 0 48 48"><path d="M24 14a10 10 0 0 0-10 10c0 2 1 4 3 5v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7c2-1 3-3 3-5a10 10 0 0 0-10-10z"/><path d="M21 30h6M21 35h6"/></svg>',
      fluids: '<svg viewBox="0 0 48 48"><path d="M20 6h8v8a4 4 0 0 1-8 0V6zM16 22h16l-2 18a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2l-2-18zM18 30h12"/></svg>',
      help: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M24 20v-2a4 4 0 0 0-8 0M20 32h8M24 28v4"/></svg>',
    };

    // ===== STEPS =====
    const STEPS = [
      { key: 'body', title: 'Какой тип кузова?', cols: 3, options: [
        { id: 'sedan', label: 'Седан', icon: 'sedan' },
        { id: 'hatchback', label: 'Хэтчбек', icon: 'hatchback' },
        { id: 'wagon', label: 'Универсал', icon: 'wagon' },
        { id: 'crossover', label: 'Кроссовер', icon: 'crossover' },
        { id: 'minivan', label: 'Минивэн', icon: 'minivan' },
        { id: 'suv', label: 'Внедорожник', icon: 'suv' },
        { id: 'undecided', label: 'Не определился', icon: 'help' },
      ]},
      { key: 'fuel', title: 'Какое топливо?', cols: 3, options: [
        { id: 'gasoline', label: 'Бензин', icon: 'gasoline' },
        { id: 'diesel', label: 'Дизель', icon: 'diesel' },
        { id: 'hybrid', label: 'Гибрид', icon: 'hybrid' },
        { id: 'electric', label: 'Электро', icon: 'electric' },
        { id: 'plugin', label: 'Плагин', icon: 'plugin' },
        { id: 'undecided', label: 'Не определился', icon: 'help' },
      ]},
      { key: 'budget', title: 'Ваш бюджет?', cols: 2, options: [
        { id: 'up10', label: 'до $10 000', icon: 'fluids' },
        { id: '10-20', label: '$10 000 – $20 000', icon: 'fluids' },
        { id: '20-30', label: '$20 000 – $30 000', icon: 'fluids' },
        { id: '30plus', label: 'от $30 000', icon: 'fluids' },
      ]},
      { key: 'gift', title: 'Подарок при заказе?', cols: 2, options: [
        { id: 'polish', label: 'Полировка', icon: 'polish' },
        { id: 'clean', label: 'Химчистка', icon: 'clean' },
        { id: 'service', label: 'Скидка на сервис', icon: 'service' },
        { id: 'fluids', label: 'Жидкости и фильтры', icon: 'fluids' },
      ]},
    ];

    // ===== STATE =====
    let current = 0; // 0..3 = questions, 4 = contact, 5 = success
    let answers = {};
    let contact = { name: '', phone: '' };

    const body = document.getElementById('quizBody');
    const progressFill = document.getElementById('progressFill');

    function render() {
      const total = STEPS.length + 1; // questions + contact
      if (current < STEPS.length) {
        progressFill.style.width = ((current + 1) / total * 100) + '%';
        renderQuestion(STEPS[current]);
      } else if (current === STEPS.length) {
        progressFill.style.width = (100) + '%';
        renderContact();
      } else {
        renderSuccess();
      }
    }

    function renderQuestion(step) {
      const selected = answers[step.key];
      const opts = step.options.map(o => `
        <div class="opt ${selected === o.id ? 'selected' : ''}" data-id="${o.id}" role="button" tabindex="0">
          ${ICONS[o.icon] || ''}
          <span class="lbl">${o.label}</span>
        </div>`).join('');

      body.innerHTML = `
        <div class="step-title">${step.title}</div>
        <div class="options cols-${step.cols}">${opts}</div>
        <div class="quiz-nav">
          ${current > 0 ? '<button class="btn-ghost" id="backBtn">Назад</button>' : ''}
          <button class="btn-primary" id="nextBtn" ${selected ? '' : 'disabled'}>Далее</button>
        </div>`;

      body.querySelectorAll('.opt').forEach(el => {
        const pick = () => { answers[step.key] = el.dataset.id; renderQuestion(step); };
        el.addEventListener('click', pick);
        el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
      const next = document.getElementById('nextBtn');
      next.addEventListener('click', () => { if (answers[step.key]) { current++; render(); } });
      const back = document.getElementById('backBtn');
      if (back) back.addEventListener('click', () => { current--; render(); });
    }

    function renderContact() {
      body.innerHTML = `
        <div class="step-title">Куда отправить подборку?</div>
        <div class="field-wrap">
          <label class="field-label" for="nameField">Ваше имя</label>
          <input class="field" id="nameField" type="text" placeholder="Как к вам обращаться" value="${contact.name}" />
        </div>
        <div class="field-wrap">
          <label class="field-label" for="phoneField">Телефон</label>
          <input class="field" id="phoneField" type="tel" placeholder="+38 (0__) ___ __ __" value="${contact.phone}" />
          <p class="hint" id="phoneHint"></p>
        </div>
        <div class="quiz-nav">
          <button class="btn-ghost" id="backBtn">Назад</button>
          <button class="btn-primary" id="submitBtn" disabled>Получить подборку</button>
        </div>`;

      const nameField = document.getElementById('nameField');
      const phoneField = document.getElementById('phoneField');
      const phoneHint = document.getElementById('phoneHint');
      const submitBtn = document.getElementById('submitBtn');

      nameField.addEventListener('input', () => { contact.name = nameField.value; validate(); });
      phoneField.addEventListener('input', () => { contact.phone = phoneField.value; validate(); });

      function validate() {
        const digits = phoneField.value.replace(/\D/g, '');
        const ok = digits.length >= 10 && contact.name.trim().length > 0;
        const phoneOk = digits.length >= 10;
        phoneField.classList.toggle('valid', phoneOk && phoneField.value.length > 0);
        phoneField.classList.toggle('invalid', !phoneOk && phoneField.value.length > 0);
        if (phoneField.value.length === 0) { phoneHint.textContent = ''; phoneHint.className = 'hint'; }
        else if (phoneOk) { phoneHint.textContent = '✓ Номер верный'; phoneHint.className = 'hint ok'; }
        else { phoneHint.textContent = 'Введите корректный номер'; phoneHint.className = 'hint err'; }
        submitBtn.disabled = !ok;
      }

      document.getElementById('backBtn').addEventListener('click', () => { current--; render(); });
      submitBtn.addEventListener('click', () => { current = STEPS.length + 1; render(); });
      if (contact.phone) validate();
    }

    function renderSuccess() {
      body.innerHTML = `
        <div class="success">
          <div class="badge"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
          <h3>Заявка отправлена!</h3>
          <p>Менеджер VIBECAR свяжется с вами в течение 15 минут.</p>
        </div>`;
    }

    render();
  </script>
</body>
</html>
